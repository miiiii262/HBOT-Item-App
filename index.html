<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBOT Inventory System</title>
  <style>
    /* 極簡黑白紅專業風格 */
    body { font-family: "Helvetica Neue", Arial, sans-serif; padding: 20px; margin: auto; background-color: #ffffff; color: #000000; max-width: 1200px; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #000000; }
    .header-title { margin: 0; font-size: 28px; font-weight: bold; letter-spacing: 1px; }
    .status-text { font-size: 13px; color: #666666; margin-top: 5px; }
    
    .btn-group { display: flex; gap: 10px; }
    .btn { padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border: 2px solid #000000; transition: all 0.2s; }
    .btn-todo { background-color: #ffffff; color: #000000; }
    .btn-todo:hover, .btn-todo:active { background-color: #e0e0e0; }
    .btn-save { background-color: #000000; color: #ffffff; }
    .btn-save:hover, .btn-save:active { background-color: #333333; color: #ffffff; }
    
    .table-container { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 950px; }
    th { background-color: #000000; color: #ffffff; padding: 12px; text-align: center; font-size: 14px; font-weight: normal; letter-spacing: 1px; }
    td { padding: 12px 10px; border-bottom: 1px solid #e0e0e0; text-align: center; vertical-align: middle; }
    
    .item-photo { width: 64px; height: 64px; object-fit: cover; border: 1px solid #e0e0e0; display: block; margin: auto; transition: transform 0.2s; }
    .item-photo:hover { transform: scale(1.05); }
    .no-photo { background-color: #f5f5f7; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #999; text-align: center; line-height: 1.2; font-weight: bold; }
    
    /* 允許顯示兩行文字 (Line Clamp) */
    .col-name { 
      max-width: 220px; 
      text-align: left; 
      font-weight: bold; 
      display: -webkit-box;
      -webkit-line-clamp: 2; 
      -webkit-box-orient: vertical;  
      overflow: hidden; 
      text-overflow: ellipsis;
      white-space: normal;
      line-height: 1.3;
    }
    .col-loc { max-width: 110px; font-size: 13px; color: #333333; }
    
    .controls { display: inline-flex; align-items: center; justify-content: center; }
    .controls button { width: 32px; height: 32px; font-size: 20px; line-height: 1; margin: 0 10px; border: 1px solid #000000; background-color: #ffffff; color: #000000; cursor: pointer; }
    .controls button:active { background-color: #000000; color: #ffffff; }
    
    .stock-val { font-size: 20px; font-weight: bold; width: 45px; text-align: center; }
    .alert-red { color: #d90000; font-weight: bold; }
    .order-info { font-size: 11px; color: #d90000; margin-top: 8px; line-height: 1.3; font-weight: normal; }
    .btn-receive { margin-top: 6px; font-size: 11px; padding: 4px 8px; background-color: #ffffff; border: 2px solid #000; cursor: pointer; font-weight: bold; }
    .btn-receive:hover { background-color: #f0f0f0; }
    
    .remark-input { width: 90%; padding: 8px; font-size: 14px; border: 1px solid #000000; background-color: #ffffff; outline: none; }
    .modified-row td:first-child { border-left: 4px solid #000000; padding-left: 6px; }
    
    /* 彈出視窗 (Modal) 設計 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; }
    .modal-content { background: #ffffff; padding: 25px; max-width: 800px; width: 95%; max-height: 85vh; overflow-y: auto; border: 2px solid #000; position: relative; }
    .close-btn { position: absolute; top: 10px; right: 20px; font-size: 28px; cursor: pointer; font-weight: bold; }
    
    #loading { text-align: center; padding: 40px; font-size: 16px; letter-spacing: 1px; color: #666; }
  </style>
</head>
<body>

  <div class="header-bar">
    <div>
      <h2 class="header-title">HBOT INVENTORY</h2>
      <div class="status-text" id="last-update">Last Update: --</div>
    </div>
    <div class="btn-group">
      <button class="btn btn-todo" onclick="openTodoModal()">📋 TO-DO LIST</button>
      <button class="btn btn-save" id="save-btn" onclick="saveData()">SAVE RECORD</button>
    </div>
  </div>
  
  <div id="loading">LOADING DATA...</div>

  <div class="table-container">
    <table id="inventory-table" style="display: none;">
      <thead>
        <tr>
          <th style="width: 80px;">PHOTO</th>
          <th style="text-align: left;">ITEM DESCRIPTION</th>
          <th>LOCATION</th>
          <th>TARGET (QTY)</th>
          <th>CURRENT STOCK</th>
          <th>ORDER NEEDED</th>
          <th>REMARKS</th>
        </tr>
      </thead>
      <tbody id="inventory-list"></tbody>
    </table>
  </div>

  <!-- 照片放大彈出視窗 -->
  <div id="photo-modal" class="modal-overlay" onclick="closePhotoModal()">
    <img id="enlarged-img" src="" style="max-width: 90%; max-height: 90%; border: 4px solid #fff; object-fit: contain;">
  </div>

  <!-- 訂貨清單彈出視窗 -->
  <div id="todo-modal" class="modal-overlay">
    <div class="modal-content">
      <span class="close-btn" onclick="closeTodoModal()">&times;</span>
      <h2 style="margin-top:0; border-bottom: 2px solid #000; padding-bottom:10px;">ORDER TO-DO LIST</h2>
      <table style="min-width: 100%;">
        <thead>
          <tr>
            <th style="text-align: left;">ITEM</th>
            <th>ORDER NEEDED</th>
            <th>ACTION</th>
          </tr>
        </thead>
        <tbody id="todo-list-body"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwbhpX7ZHMNskpxRGz4mtQTBNqAlRHlKNY_bxB4kdP0J4F7X40-UAPFdEVpxeeYBRY/exec";
    let inventoryData = [];

    async function loadData() {
      try {
        const response = await fetch(API_URL + "?action=get");
        inventoryData = await response.json();
        inventoryData.forEach(item => item.isModified = false);
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('inventory-table').style.display = 'table';
        renderTable();
      } catch (error) {
        document.getElementById('loading').innerText = "ERROR: Failed to load data.";
      }
    }

    function renderTable() {
      const tbody = document.getElementById('inventory-list');
      tbody.innerHTML = "";

      inventoryData.forEach((item, index) => {
        const tr = document.createElement('tr');
        if(item.isModified) tr.className = "modified-row";
        
        const orderNeededClass = item.orderNeeded > 0 ? "alert-red" : "";
        
        const photoHtml = item.imgUrl && item.imgUrl.trim() !== "" 
          ? `<img src="${item.imgUrl}" class="item-photo" style="cursor:zoom-in;" alt="Photo" onclick="openPhotoModal('${item.imgUrl}')">`
          : `<div class="item-photo no-photo">NO<br>PHOTO</div>`;

        // 如果有待收貨 (Pending)，顯示狀態與 Receive 按鈕
        let orderStatusHtml = "";
        let pQty = parseInt(item.pendingQty) || 0;
        if(item.isOrdered === 'Y' || pQty > 0) {
          orderStatusHtml = `
            <div class="order-info"><b>ORDERED: ${pQty}</b><br>By: ${item.orderedBy}<br>${item.orderTime}</div>
            <button class="btn-receive" onclick="receiveItem(${index})">☑️ RECEIVE</button>
          `;
        }

        tr.innerHTML = `
          <td>${photoHtml}</td>
          <td class="col-name" title="${item.description}">${item.description}</td>
          <td class="col-loc">${item.location}</td>
          <td style="font-size: 18px; font-weight: bold; color: #666;">${item.qty}</td>
          
          <td>
            <div class="controls">
              <button onclick="updateCurrentStock(${index}, -1)">-</button>
              <div class="stock-val">${item.stock}</div>
              <button onclick="updateCurrentStock(${index}, 1)">+</button>
            </div>
          </td>
          
          <td>
            <div class="controls">
              <button onclick="updateOrderNeeded(${index}, -1)">-</button>
              <div class="stock-val ${orderNeededClass}">${item.orderNeeded}</div>
              <button onclick="updateOrderNeeded(${index}, 1)">+</button>
            </div>
            ${orderStatusHtml}
          </td>
          
          <td>
            <input type="text" class="remark-input" value="${item.remark}" placeholder="..." onchange="updateRemark(${index}, this.value)">
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 計算庫存時，自動扣除「已經訂貨(Pending)」的數量
    function updateCurrentStock(index, change) {
      let item = inventoryData[index];
      item.stock = parseInt(item.stock) + change;
      if (item.stock < 0) item.stock = 0;
      
      let qtyNum = parseInt(item.qty) || 0;
      let pending = parseInt(item.pendingQty) || 0;
      let calculatedOrder = qtyNum - item.stock - pending;
      item.orderNeeded = calculatedOrder > 0 ? calculatedOrder : 0;
      
      item.isModified = true;
      renderTable();
    }

    function updateOrderNeeded(index, change) {
      let item = inventoryData[index];
      item.orderNeeded = parseInt(item.orderNeeded) + change;
      if (item.orderNeeded < 0) item.orderNeeded = 0;
      item.isModified = true;
      renderTable();
    }

    function updateRemark(index, val) {
      inventoryData[index].remark = val;
      inventoryData[index].isModified = true;
    }

    // 訂貨：詢問訂貨數量，記錄 Pending，並歸零 Order Needed
    function placeOrder(index) {
      let currentNeed = parseInt(inventoryData[index].orderNeeded) || 0;
      let orderAmt = prompt(`Confirm order quantity for [${inventoryData[index].description}]:`, currentNeed);
      
      if(orderAmt !== null && orderAmt.trim() !== "" && !isNaN(orderAmt)) {
        let amt = parseInt(orderAmt);
        if(amt > 0) {
          let name = prompt("Enter your Name to confirm placement:", "");
          if(name && name.trim() !== "") {
            let now = new Date();
            let timeStr = now.toLocaleDateString('en-GB') + " " + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            inventoryData[index].isOrdered = "Y";
            inventoryData[index].orderedBy = name.trim();
            inventoryData[index].orderTime = timeStr;
            inventoryData[index].pendingQty = (parseInt(inventoryData[index].pendingQty) || 0) + amt;
            
            // 重新計算剩下的 Order Needed
            let target = parseInt(inventoryData[index].qty) || 0;
            inventoryData[index].orderNeeded = Math.max(0, target - inventoryData[index].stock - inventoryData[index].pendingQty);
            
            inventoryData[index].isModified = true;
            renderTable();
            openTodoModal(); // 更新彈出視窗
          }
        }
      }
    }

    // 收貨：扣除 Pending，增加 Stock
    function receiveItem(index) {
      let pending = parseInt(inventoryData[index].pendingQty) || 0;
      let qty = prompt(`How many [${inventoryData[index].description}] did you receive?\n(Currently pending: ${pending})`, pending);
      
      if(qty !== null && qty.trim() !== "" && !isNaN(qty)) {
        let r = parseInt(qty);
        if(r > 0) {
          inventoryData[index].stock = (parseInt(inventoryData[index].stock) || 0) + r;
          inventoryData[index].pendingQty = Math.max(0, pending - r);
          
          let target = parseInt(inventoryData[index].qty) || 0;
          inventoryData[index].orderNeeded = Math.max(0, target - inventoryData[index].stock - inventoryData[index].pendingQty);
          
          // 如果所有 pending 的貨都收完了，清除訂單狀態
          if(inventoryData[index].pendingQty === 0) {
            inventoryData[index].isOrdered = "";
            inventoryData[index].orderedBy = "";
            inventoryData[index].orderTime = "";
          }
          
          inventoryData[index].isModified = true;
          renderTable();
        }
      }
    }

    // Modal 控制: 照片
    function openPhotoModal(url) {
      document.getElementById('enlarged-img').src = url;
      document.getElementById('photo-modal').style.display = 'flex';
    }
    function closePhotoModal() {
      document.getElementById('photo-modal').style.display = 'none';
      document.getElementById('enlarged-img').src = "";
    }

    // Modal 控制: To-Do List
    function openTodoModal() {
      const tbody = document.getElementById('todo-list-body');
      tbody.innerHTML = "";
      
      let hasTasks = false;
      inventoryData.forEach((item, index) => {
        if(item.orderNeeded > 0) {
          hasTasks = true;
          
          let actionBtn = `<button class="btn btn-save" style="padding:6px 12px; font-size:12px;" onclick="placeOrder(${index})">Place Order</button>`;

          tbody.innerHTML += `
            <tr>
              <td style="text-align:left; font-weight:bold;">${item.description}</td>
              <td style="font-size: 18px; font-weight:bold; color:#d90000;">${item.orderNeeded}</td>
              <td>${actionBtn}</td>
            </tr>
          `;
        }
      });
      
      if(!hasTasks) {
        tbody.innerHTML = `<tr><td colspan="3" style="padding: 20px;">No items currently need to be ordered.</td></tr>`;
      }
      
      document.getElementById('todo-modal').style.display = 'flex';
    }
    function closeTodoModal() {
      document.getElementById('todo-modal').style.display = 'none';
    }

    async function saveData() {
      const modifiedItems = inventoryData.filter(item => item.isModified);
      if (modifiedItems.length === 0) { alert("No changes detected."); return; }

      const userName = prompt("Enter Staff Name to confirm save:", "");
      if (userName === null || userName.trim() === "") return;

      const saveBtn = document.getElementById('save-btn');
      saveBtn.innerText = "SAVING...";
      saveBtn.disabled = true;

      const payload = { userName: userName.trim(), items: modifiedItems };

      try {
        const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
        const result = await response.json();

        if (result.success) {
          document.getElementById('last-update').innerText = "Last Update: " + result.lastUpdate;
          alert("Records saved successfully.");
          inventoryData.forEach(item => item.isModified = false);
          renderTable();
        }
      } catch (error) {
        alert("ERROR: Failed to save. Please check network.");
      }

      saveBtn.innerText = "SAVE RECORD";
      saveBtn.disabled = false;
    }

    loadData();
  </script>
</body>
</html>
