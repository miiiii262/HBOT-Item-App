<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBOT Inventory System</title>
  <style>
    /* 極簡黑白紅專業風格 */
    body { font-family: "Helvetica Neue", Arial, sans-serif; padding: 20px; margin: auto; background-color: #ffffff; color: #000000; max-width: 1200px; }
    
    /* 頂部控制列 */
    .header-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #000000; }
    .header-title { margin: 0; font-size: 28px; font-weight: bold; letter-spacing: 1px; }
    .status-text { font-size: 13px; color: #666666; margin-top: 5px; }
    
    .save-btn { padding: 10px 30px; font-size: 16px; font-weight: bold; background-color: #000000; color: #ffffff; border: 2px solid #000000; cursor: pointer; transition: all 0.2s; }
    .save-btn:hover, .save-btn:active { background-color: #ffffff; color: #000000; }
    .save-btn:disabled { background-color: #cccccc; border-color: #cccccc; cursor: not-allowed; }
    
    /* 表格排版 */
    .table-container { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th { background-color: #000000; color: #ffffff; padding: 12px; text-align: center; font-size: 14px; font-weight: normal; letter-spacing: 1px; }
    td { padding: 12px 10px; border-bottom: 1px solid #e0e0e0; text-align: center; vertical-align: middle; }
    
    /* 限制名稱長度並靠左對齊 */
    .col-name { max-width: 200px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: bold; }
    .col-loc { max-width: 120px; font-size: 13px; color: #333333; }
    
    /* 數字與按鈕設計 (黑白線條風) */
    .controls { display: inline-flex; align-items: center; justify-content: center; }
    .controls button { width: 32px; height: 32px; font-size: 20px; line-height: 1; margin: 0 10px; border: 1px solid #000000; background-color: #ffffff; color: #000000; cursor: pointer; touch-action: manipulation; }
    .controls button:active { background-color: #000000; color: #ffffff; }
    
    .stock-val { font-size: 20px; font-weight: bold; width: 45px; text-align: center; }
    
    /* 紅色警示 (當需要訂貨時) */
    .alert-red { color: #d90000; font-weight: bold; }
    
    /* 備註輸入框 */
    .remark-input { width: 90%; padding: 8px; font-size: 14px; border: 1px solid #000000; background-color: #ffffff; outline: none; }
    .remark-input:focus { border-width: 2px; }
    
    /* 已修改標記 (左側加上黑線) */
    .modified-row td:first-child { border-left: 4px solid #000000; padding-left: 6px; }
    
    #loading { text-align: center; padding: 40px; font-size: 16px; letter-spacing: 1px; color: #666; }
  </style>
</head>
<body>

  <div class="header-bar">
    <div>
      <h2 class="header-title">HBOT INVENTORY</h2>
      <div class="status-text" id="last-update">Last Update: --</div>
    </div>
    <button class="save-btn" id="save-btn" onclick="saveData()">SAVE RECORD</button>
  </div>
  
  <div id="loading">LOADING DATA...</div>

  <div class="table-container">
    <table id="inventory-table" style="display: none;">
      <thead>
        <tr>
          <th style="text-align: left;">ITEM DESCRIPTION</th>
          <th>LOCATION</th>
          <th>TARGET (QTY)</th>
          <th>CURRENT STOCK</th>
          <th>ORDER NEEDED</th>
          <th>REMARKS</th>
        </tr>
      </thead>
      <tbody id="inventory-list"></tbody>
    </table>
  </div>

  <script>
    // 已經幫你替換好專屬的 API URL
    const API_URL = "https://script.google.com/macros/s/AKfycbwbhpX7ZHMNskpxRGz4mtQTBNqAlRHlKNY_bxB4kdP0J4F7X40-UAPFdEVpxeeYBRY/exec";
    
    let inventoryData = [];

    // 1. 載入資料
    async function loadData() {
      try {
        const response = await fetch(API_URL + "?action=get");
        inventoryData = await response.json();
        
        inventoryData.forEach(item => item.isModified = false);
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('inventory-table').style.display = 'table';
        renderTable();
      } catch (error) {
        document.getElementById('loading').innerText = "ERROR: Failed to load data. Please check network.";
      }
    }

    // 2. 渲染表格
    function renderTable() {
      const tbody = document.getElementById('inventory-list');
      tbody.innerHTML = "";

      inventoryData.forEach((item, index) => {
        const tr = document.createElement('tr');
        if(item.isModified) tr.className = "modified-row";
        
        // 判斷 Order Needed 是否大於 0，給予紅色 Alert class
        const orderNeededClass = item.orderNeeded > 0 ? "alert-red" : "";

        tr.innerHTML = `
          <td class="col-name" title="${item.description}">${item.description}</td>
          <td class="col-loc">${item.location}</td>
          <td style="font-size: 18px; font-weight: bold; color: #666;">${item.qty}</td>
          
          <td>
            <div class="controls">
              <button onclick="updateCurrentStock(${index}, -1)">-</button>
              <div class="stock-val">${item.stock}</div>
              <button onclick="updateCurrentStock(${index}, 1)">+</button>
            </div>
          </td>
          
          <td>
            <div class="controls">
              <button onclick="updateOrderNeeded(${index}, -1)">-</button>
              <div class="stock-val ${orderNeededClass}">${item.orderNeeded}</div>
              <button onclick="updateOrderNeeded(${index}, 1)">+</button>
            </div>
          </td>
          
          <td>
            <input type="text" class="remark-input" value="${item.remark}" placeholder="..." onchange="updateRemark(${index}, this.value)">
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 3. 更新 Current Stock (連動計算 Order Needed)
    function updateCurrentStock(index, change) {
      let item = inventoryData[index];
      item.stock = parseInt(item.stock) + change;
      if (item.stock < 0) item.stock = 0;
      
      let qtyNum = parseInt(item.qty) || 0;
      let calculatedOrder = qtyNum - item.stock;
      item.orderNeeded = calculatedOrder > 0 ? calculatedOrder : 0;
      
      item.isModified = true;
      renderTable();
    }

    // 4. 手動覆蓋更新 Order Needed
    function updateOrderNeeded(index, change) {
      let item = inventoryData[index];
      item.orderNeeded = parseInt(item.orderNeeded) + change;
      if (item.orderNeeded < 0) item.orderNeeded = 0;
      
      item.isModified = true;
      renderTable();
    }

    // 5. 更新 Remark
    function updateRemark(index, val) {
      inventoryData[index].remark = val;
      inventoryData[index].isModified = true;
    }

    // 6. 批量儲存
    async function saveData() {
      const modifiedItems = inventoryData.filter(item => item.isModified);
      
      if (modifiedItems.length === 0) {
        alert("No changes detected.");
        return;
      }

      const userName = prompt("Enter Staff Name to confirm save:", "");
      if (userName === null || userName.trim() === "") {
        return; // 取消或未輸入姓名則終止
      }

      const saveBtn = document.getElementById('save-btn');
      saveBtn.innerText = "SAVING...";
      saveBtn.disabled = true;

      const payload = {
        userName: userName.trim(),
        items: modifiedItems
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.success) {
          document.getElementById('last-update').innerText = "Last Update: " + result.lastUpdate;
          alert("Records saved successfully.");
          
          inventoryData.forEach(item => item.isModified = false);
          renderTable();
        }
      } catch (error) {
        alert("ERROR: Failed to save. Please check network.");
      }

      saveBtn.innerText = "SAVE RECORD";
      saveBtn.disabled = false;
    }

    // 啟動載入
    loadData();
  </script>
</body>
</html>
