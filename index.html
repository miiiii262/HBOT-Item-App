<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBOT Inventory System</title>
  <style>
    body { font-family: "Helvetica Neue", Arial, sans-serif; padding: 20px; margin: auto; background-color: #ffffff; color: #000000; max-width: 1300px; }
    
    .header-bar { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 2px solid #000; }
    .header-title { margin: 0; font-size: 28px; font-weight: bold; letter-spacing: 1px; }
    .status-text { font-size: 13px; color: #666; margin-top: 5px; }
    
    .search-container { margin-bottom: 20px; }
    .search-input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #000; outline: none; box-sizing: border-box; }
    
    .btn-group { display: flex; gap: 10px; }
    .btn { padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border: 2px solid #000; transition: all 0.2s; }
    .btn-todo { background-color: #fff; color: #000; }
    .btn-todo:hover, .btn-todo:active { background-color: #e0e0e0; }
    .btn-save { background-color: #000; color: #fff; }
    .btn-save:hover, .btn-save:active { background-color: #333; color: #fff; }
    
    .table-container { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 1050px; }
    th { background-color: #000; color: #fff; padding: 12px; text-align: center; font-size: 14px; font-weight: normal; letter-spacing: 1px; }
    td { padding: 12px 10px; border-bottom: 1px solid #e0e0e0; text-align: center; vertical-align: middle; }
    
    .item-photo { width: 64px; height: 64px; object-fit: cover; border: 1px solid #e0e0e0; display: block; margin: auto; transition: transform 0.2s; cursor: zoom-in; }
    .item-photo:hover { transform: scale(1.05); }
    .no-photo { background-color: #f5f5f7; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #999; text-align: center; line-height: 1.2; font-weight: bold; }
    
    .col-name { max-width: 250px; text-align: left; font-weight: bold; white-space: normal; line-height: 1.4; font-size: 14px; padding-right: 15px; }
    .col-loc { max-width: 110px; font-size: 13px; color: #333; }
    
    .controls { display: inline-flex; align-items: center; justify-content: center; }
    .controls button { width: 32px; height: 32px; font-size: 20px; line-height: 1; margin: 0; border: 1px solid #000; background-color: #fff; color: #000; cursor: pointer; }
    .controls button:active { background-color: #000; color: #fff; }
    
    .stock-input { width: 50px; height: 30px; font-size: 18px; font-weight: bold; text-align: center; border: 1px solid #ccc; margin: 0 6px; outline: none; -moz-appearance: textfield; }
    .stock-input::-webkit-outer-spin-button, .stock-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .stock-input:focus { border-color: #000; border-width: 2px; }
    
    .stock-val { font-size: 20px; font-weight: bold; width: 45px; text-align: center; margin: 0 6px; }
    
    .alert-red { color: #cc0000; font-weight: bold; }
    
    /* 獨立 Backorder 區塊設計 */
    .pending-box { padding: 8px; background-color: #f1f8f3; border: 2px solid #1e7e34; border-radius: 4px; text-align: left; min-width: 110px; }
    .pending-title { color: #1e7e34; font-size: 13px; font-weight: bold; display: block; margin-bottom: 4px; border-bottom: 1px solid #1e7e34; padding-bottom: 2px; }
    .order-info { font-size: 11px; color: #555; line-height: 1.3; }
    .btn-receive { margin-top: 8px; width: 100%; font-size: 12px; padding: 6px; background-color: #fff; border: 2px solid #000; cursor: pointer; font-weight: bold; transition: background-color 0.2s; }
    .btn-receive:hover { background-color: #1e7e34; color: #fff; border-color: #1e7e34; }
    
    .remark-input { width: 90%; padding: 8px; font-size: 14px; border: 1px solid #000; outline: none; }
    .modified-row td:first-child { border-left: 4px solid #000; padding-left: 6px; }
    
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 25px; max-width: 1000px; width: 95%; max-height: 85vh; overflow-y: auto; border: 2px solid #000; position: relative; }
    .close-btn { position: absolute; top: 10px; right: 20px; font-size: 28px; cursor: pointer; font-weight: bold; }
    
    .todo-qty-input { width: 60px; padding: 5px; font-size: 16px; text-align: center; border: 1px solid #000; }
    .todo-checkbox { width: 18px; height: 18px; cursor: pointer; }
    
    #loading { text-align: center; padding: 40px; font-size: 16px; color: #666; }
  </style>
</head>
<body>

  <div class="header-bar">
    <div>
      <h2 class="header-title">HBOT INVENTORY</h2>
      <div class="status-text" id="last-update">Last Update: --</div>
    </div>
    <div class="btn-group">
      <button class="btn btn-todo" onclick="openTodoModal()">TO-DO LIST</button>
      <button class="btn btn-save" id="save-btn" onclick="saveData()">SAVE RECORD</button>
    </div>
  </div>

  <div class="search-container">
    <input type="text" id="search-bar" class="search-input" onkeyup="filterTable()" placeholder="Search item description or location...">
  </div>
  
  <div id="loading">LOADING DATA...</div>

  <div class="table-container">
    <table id="inventory-table" style="display: none;">
      <thead>
        <tr>
          <th style="width: 70px;">PHOTO</th>
          <th style="text-align: left;">ITEM DESCRIPTION</th>
          <th>LOCATION</th>
          <th>TARGET</th>
          <th>CURRENT STOCK</th>
          <th style="width: 130px;">ORDER NEEDED</th>
          <th style="width: 140px;">BACKORDER</th> <!-- 新增獨立欄位 -->
          <th>REMARKS</th>
        </tr>
      </thead>
      <tbody id="inventory-list"></tbody>
    </table>
  </div>

  <div id="photo-modal" class="modal-overlay" onclick="closePhotoModal()">
    <img id="enlarged-img" src="" style="max-width: 90%; max-height: 90%; border: 4px solid #fff; object-fit: contain;">
  </div>

  <div id="todo-modal" class="modal-overlay">
    <div class="modal-content">
      <span class="close-btn" onclick="closeTodoModal()">&times;</span>
      <h2 style="margin-top:0; border-bottom: 2px solid #000; padding-bottom:10px;">BATCH ORDER TO-DO LIST</h2>
      <table style="min-width: 100%; margin-bottom: 20px;">
        <thead>
          <tr>
            <th style="width: 40px;"><input type="checkbox" id="select-all" class="todo-checkbox" onchange="toggleSelectAll(this)"></th>
            <th style="text-align: left;">ITEM DESCRIPTION</th>
            <th>SUGGESTED</th>
            <th>ORDER QTY</th>
            <th style="width: 30%;">REMARK</th>
          </tr>
        </thead>
        <tbody id="todo-list-body"></tbody>
      </table>
      <div style="text-align: right;">
        <button class="btn btn-save" onclick="batchPlaceOrder()">Execute Batch Order</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwbhpX7ZHMNskpxRGz4mtQTBNqAlRHlKNY_bxB4kdP0J4F7X40-UAPFdEVpxeeYBRY/exec";
    let inventoryData = [];

    async function loadData() {
      try {
        const response = await fetch(API_URL + "?action=get");
        inventoryData = await response.json();
        inventoryData.forEach(item => {
          item.isModified = false;
          item.actionLog = ""; 
        });
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('inventory-table').style.display = 'table';
        renderTable();
      } catch (error) {
        document.getElementById('loading').innerText = "ERROR: Failed to load data.";
      }
    }

    function appendLog(item, msg) {
      if(item.actionLog) {
        item.actionLog += " | " + msg;
      } else {
        item.actionLog = msg;
      }
    }

    function renderTable() {
      const tbody = document.getElementById('inventory-list');
      tbody.innerHTML = "";
      
      const searchTerm = document.getElementById('search-bar').value.toLowerCase();

      inventoryData.forEach((item, index) => {
        if(searchTerm && !item.description.toLowerCase().includes(searchTerm) && !item.location.toLowerCase().includes(searchTerm)) {
          return; 
        }

        const tr = document.createElement('tr');
        if(item.isModified) tr.className = "modified-row";
        
        const orderNeededClass = item.orderNeeded > 0 ? "alert-red" : "";
        const photoHtml = item.imgUrl && item.imgUrl.trim() !== "" 
          ? `<img src="${item.imgUrl}" class="item-photo" onclick="openPhotoModal('${item.imgUrl}')">`
          : `<div class="item-photo no-photo">NO<br>PHOTO</div>`;

        let backorderHtml = "";
        let pQty = parseInt(item.pendingQty) || 0;
        
        if(item.isOrdered === 'Y' || pQty > 0) {
          backorderHtml = `
            <div class="pending-box">
              <span class="pending-title">IN TRANSIT: ${pQty}</span>
              <span class="order-info">By: ${item.orderedBy}<br>${item.orderTime}</span>
              <button class="btn-receive" onclick="receiveItem(${index})">RECEIVE</button>
            </div>
          `;
        }

        tr.innerHTML = `
          <td>${photoHtml}</td>
          <td class="col-name" title="${item.description}">${item.description}</td>
          <td class="col-loc">${item.location}</td>
          <td style="font-size: 18px; font-weight: bold; color: #666;">${item.qty}</td>
          <td>
            <div class="controls">
              <button onclick="updateCurrentStock(${index}, -1)">-</button>
              <input type="number" class="stock-input" value="${item.stock}" onchange="setManualStock(${index}, this.value)" min="0">
              <button onclick="updateCurrentStock(${index}, 1)">+</button>
            </div>
          </td>
          <td>
            <div class="controls">
              <button onclick="updateOrderNeeded(${index}, -1)">-</button>
              <div class="stock-val ${orderNeededClass}">${item.orderNeeded}</div>
              <button onclick="updateOrderNeeded(${index}, 1)">+</button>
            </div>
          </td>
          <td style="vertical-align: middle;">
            ${backorderHtml}
          </td>
          <td>
            <input type="text" class="remark-input" value="${item.remark}" onchange="updateRemark(${index}, this.value)">
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function filterTable() { renderTable(); }

    function updateCurrentStock(index, change) {
      let item = inventoryData[index];
      item.stock = Math.max(0, parseInt(item.stock) + change);
      
      let qtyNum = parseInt(item.qty) || 0;
      let pending = parseInt(item.pendingQty) || 0;
      item.orderNeeded = Math.max(0, qtyNum - item.stock - pending);
      item.isModified = true;
      appendLog(item, `Stock adjusted to ${item.stock}`);
      renderTable();
    }

    function setManualStock(index, val) {
      let item = inventoryData[index];
      let num = parseInt(val);
      if (isNaN(num) || num < 0) num = 0; 
      item.stock = num;
      
      let qtyNum = parseInt(item.qty) || 0;
      let pending = parseInt(item.pendingQty) || 0;
      item.orderNeeded = Math.max(0, qtyNum - item.stock - pending);
      item.isModified = true;
      appendLog(item, `Stock typed manually as ${item.stock}`);
      renderTable();
    }

    function updateOrderNeeded(index, change) {
      let item = inventoryData[index];
      item.orderNeeded = Math.max(0, parseInt(item.orderNeeded) + change);
      item.isModified = true;
      appendLog(item, `Order needed adjusted to ${item.orderNeeded}`);
      renderTable();
    }

    function updateRemark(index, val) {
      inventoryData[index].remark = val;
      inventoryData[index].isModified = true;
      appendLog(inventoryData[index], `Remark updated`);
    }

    function receiveItem(index) {
      let pending = parseInt(inventoryData[index].pendingQty) || 0;
      let qty = prompt(`[${inventoryData[index].description}]\n\nCurrently on BACKORDER: ${pending}\n\nEnter the exact amount you received today:`, pending);
      
      if(qty !== null && qty.trim() !== "" && !isNaN(qty)) {
        let r = parseInt(qty);
        if(r >= 0) {
          inventoryData[index].stock = (parseInt(inventoryData[index].stock) || 0) + r;
          let logMsg = `Received ${r} items`;
          
          if (r < pending) {
            let missing = pending - r;
            let keepPending = confirm(`WARNING: You ordered ${pending} but only received ${r}.\nThere are ${missing} items missing.\n\nDo you want to keep these ${missing} items on BACKORDER?\n\n- Click OK to keep them Pending.\n- Click Cancel if the supplier cancelled them.`);
            if(keepPending) {
                inventoryData[index].pendingQty = missing;
                logMsg += ` (${missing} kept on backorder)`;
            } else {
                inventoryData[index].pendingQty = 0;
                logMsg += ` (${missing} cancelled from backorder)`;
            }
          } else {
             inventoryData[index].pendingQty = Math.max(0, pending - r);
             logMsg += ` (Order complete)`;
          }
          
          let target = parseInt(inventoryData[index].qty) || 0;
          inventoryData[index].orderNeeded = Math.max(0, target - inventoryData[index].stock - inventoryData[index].pendingQty);
          
          if(inventoryData[index].pendingQty === 0) {
            inventoryData[index].isOrdered = "";
            inventoryData[index].orderedBy = "";
            inventoryData[index].orderTime = "";
          }
          inventoryData[index].isModified = true;
          appendLog(inventoryData[index], logMsg);
          renderTable();
        }
      }
    }

    function openPhotoModal(url) {
      document.getElementById('enlarged-img').src = url;
      document.getElementById('photo-modal').style.display = 'flex';
    }
    
    function closePhotoModal() { document.getElementById('photo-modal').style.display = 'none'; }

    function openTodoModal() {
      const tbody = document.getElementById('todo-list-body');
      tbody.innerHTML = "";
      document.getElementById('select-all').checked = false;
      
      let hasTasks = false;
      inventoryData.forEach((item, index) => {
        if(item.orderNeeded > 0) {
          hasTasks = true;
          tbody.innerHTML += `
            <tr>
              <td><input type="checkbox" class="todo-checkbox row-cb" data-index="${index}"></td>
              <td style="text-align:left; font-weight:bold;">${item.description}</td>
              <td style="color:#cc0000; font-weight:bold; text-align:center;">${item.orderNeeded}</td>
              <td style="text-align:center;"><input type="number" class="todo-qty-input" id="batch-qty-${index}" value="${item.orderNeeded}" min="1"></td>
              <td><input type="text" class="remark-input" id="batch-remark-${index}" value="${item.remark}" placeholder="..." style="width: 100%; box-sizing: border-box;"></td>
            </tr>
          `;
        }
      });
      
      if(!hasTasks) {
        tbody.innerHTML = `<tr><td colspan="5" style="padding: 20px; text-align:center;">No items currently need to be ordered.</td></tr>`;
      }
      document.getElementById('todo-modal').style.display = 'flex';
    }

    function closeTodoModal() { document.getElementById('todo-modal').style.display = 'none'; }

    function toggleSelectAll(source) {
      const checkboxes = document.querySelectorAll('.row-cb');
      checkboxes.forEach(cb => cb.checked = source.checked);
    }

    function batchPlaceOrder() {
      const checkboxes = document.querySelectorAll('.row-cb:checked');
      if(checkboxes.length === 0) {
        alert("Please select at least one item to order.");
        return;
      }

      let name = prompt("Enter your Name to confirm batch placement:", "");
      if(!name || name.trim() === "") return;

      let now = new Date();
      let timeStr = now.toLocaleDateString('en-GB') + " " + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

      checkboxes.forEach(cb => {
        let idx = cb.getAttribute('data-index');
        let orderAmt = parseInt(document.getElementById(`batch-qty-${idx}`).value);
        let newRemark = document.getElementById(`batch-remark-${idx}`).value;
        
        if(orderAmt > 0) {
          inventoryData[idx].isOrdered = "Y";
          inventoryData[idx].orderedBy = name.trim();
          inventoryData[idx].orderTime = timeStr;
          inventoryData[idx].pendingQty = (parseInt(inventoryData[idx].pendingQty) || 0) + orderAmt;
          
          let target = parseInt(inventoryData[idx].qty) || 0;
          inventoryData[idx].orderNeeded = Math.max(0, target - inventoryData[idx].stock - inventoryData[idx].pendingQty);
          inventoryData[idx].remark = newRemark;
          inventoryData[idx].isModified = true;
          appendLog(inventoryData[idx], `Ordered ${orderAmt} items`);
        }
      });

      renderTable();
      closeTodoModal();
    }

    async function saveData() {
      if (document.activeElement) {
        document.activeElement.blur();
      }

      const modifiedItems = inventoryData.filter(item => item.isModified);
      if (modifiedItems.length === 0) { alert("No changes detected."); return; }

      const userName = prompt("Enter Staff Name to confirm save (This triggers the PDF snapshot):", "");
      if (userName === null || userName.trim() === "") return;

      const saveBtn = document.getElementById('save-btn');
      saveBtn.innerText = "SAVING & GENERATING PDF...";
      saveBtn.disabled = true;

      const payload = { userName: userName.trim(), items: modifiedItems };

      try {
        const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
        const result = await response.json();

        if (result.success) {
          document.getElementById('last-update').innerText = "Last Update: " + result.lastUpdate;
          alert("Records saved and Ward Stock PDF generated.");
          
          inventoryData.forEach(item => {
            item.isModified = false;
            item.actionLog = ""; 
          });
          renderTable();
        }
      } catch (error) {
        alert("ERROR: Failed to save. Please check network.");
      }

      saveBtn.innerText = "SAVE RECORD";
      saveBtn.disabled = false;
    }

    loadData();
  </script>
</body>
</html>
