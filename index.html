<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBOT 點數與訂貨系統</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 15px; margin: auto; background-color: #f5f5f7; }
    
    /* 頂部控制列 */
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; position: sticky; top: 0; background: #f5f5f7; padding-bottom: 10px; z-index: 100; border-bottom: 2px solid #ccc; }
    .status-text { font-size: 14px; color: #86868b; }
    .save-btn { padding: 12px 25px; font-size: 18px; font-weight: bold; background-color: #34c759; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .save-btn:active { background-color: #248a3d; }
    
    /* 表格排版 */
    .table-container { overflow-x: auto; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th { background-color: #e5e5ea; padding: 12px; text-align: center; border: 1px solid #d1d1d6; font-size: 16px; }
    td { padding: 10px; border: 1px solid #d1d1d6; text-align: center; vertical-align: middle; }
    
    /* 限制 Item Name 長度，超出的用 ..... 顯示 */
    .col-name { max-width: 160px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
    .col-loc { max-width: 100px; color: #555; }
    
    /* 數字與按鈕放大 */
    .controls { display: inline-flex; align-items: center; justify-content: center; }
    .controls button { padding: 0; width: 40px; height: 40px; font-size: 26px; font-weight: bold; margin: 0 8px; border: none; border-radius: 6px; background-color: #007aff; color: white; cursor: pointer; touch-action: manipulation; }
    .controls button:active { background-color: #005bb5; }
    .stock-val { font-size: 24px; font-weight: bold; width: 50px; text-align: center; }
    
    /* Remark 文字框 */
    .remark-input { width: 90%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    
    /* 標記已修改的列 */
    .modified-row { background-color: #ffffe0; }
  </style>
</head>
<body>

  <div class="header-bar">
    <div>
      <h2 style="margin: 0;">HBOT 點數系統</h2>
      <div class="status-text" id="last-update">Last Update: 從未</div>
    </div>
    <button class="save-btn" onclick="saveData()">💾 儲存 (Save)</button>
  </div>
  
  <div id="loading" style="text-align: center; padding: 20px;">載入資料中...</div>

  <div class="table-container">
    <table id="inventory-table" style="display: none;">
      <thead>
        <tr>
          <th>Item Name</th>
          <th>Location</th>
          <th>QTY (Target)</th>
          <th>Current Stock</th>
          <th>Order Needed</th>
          <th>Remark</th>
        </tr>
      </thead>
      <tbody id="inventory-list"></tbody>
    </table>
  </div>

  <script>
    // 【修改這裡】貼上你的 Google Web App URL
    const API_URL = "YOUR_GOOGLE_WEB_APP_URL";
    
    let inventoryData = [];

    // 1. 載入資料
    async function loadData() {
      try {
        const response = await fetch(API_URL + "?action=get");
        inventoryData = await response.json();
        
        // 標記每一列是否被手動修改過，預設為 false
        inventoryData.forEach(item => item.isModified = false);
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('inventory-table').style.display = 'table';
        renderTable();
      } catch (error) {
        document.getElementById('loading').innerText = "載入失敗，請檢查網址或網路。";
      }
    }

    // 2. 渲染表格
    function renderTable() {
      const tbody = document.getElementById('inventory-list');
      tbody.innerHTML = "";

      inventoryData.forEach((item, index) => {
        const tr = document.createElement('tr');
        if(item.isModified) tr.className = "modified-row"; // 提示哪些有修改

        tr.innerHTML = `
          <td class="col-name" title="${item.description}">${item.description}</td>
          <td class="col-loc">${item.location}</td>
          <td style="font-size: 20px; font-weight: bold; color: #ff3b30;">${item.qty}</td>
          
          <td>
            <div class="controls">
              <button onclick="updateCurrentStock(${index}, -1)">-</button>
              <div class="stock-val">${item.stock}</div>
              <button onclick="updateCurrentStock(${index}, 1)">+</button>
            </div>
          </td>
          
          <td>
            <div class="controls">
              <button style="background-color: #ff9500;" onclick="updateOrderNeeded(${index}, -1)">-</button>
              <div class="stock-val">${item.orderNeeded}</div>
              <button style="background-color: #ff9500;" onclick="updateOrderNeeded(${index}, 1)">+</button>
            </div>
          </td>
          
          <td>
            <input type="text" class="remark-input" value="${item.remark}" placeholder="特殊備註..." onchange="updateRemark(${index}, this.value)">
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 3. 更新 Current Stock (並連動計算 Order Needed)
    function updateCurrentStock(index, change) {
      let item = inventoryData[index];
      item.stock = parseInt(item.stock) + change;
      if (item.stock < 0) item.stock = 0;
      
      // 動態計算 Order Needed: QTY - Current Stock
      let qtyNum = parseInt(item.qty) || 0;
      let calculatedOrder = qtyNum - item.stock;
      item.orderNeeded = calculatedOrder > 0 ? calculatedOrder : 0;
      
      item.isModified = true;
      renderTable();
    }

    // 4. 手動覆蓋更新 Order Needed
    function updateOrderNeeded(index, change) {
      let item = inventoryData[index];
      item.orderNeeded = parseInt(item.orderNeeded) + change;
      if (item.orderNeeded < 0) item.orderNeeded = 0;
      
      item.isModified = true;
      renderTable();
    }

    // 5. 更新 Remark
    function updateRemark(index, val) {
      inventoryData[index].remark = val;
      inventoryData[index].isModified = true;
    }

    // 6. 批量儲存資料 (只傳送有修改過的列以節省時間)
    async function saveData() {
      const modifiedItems = inventoryData.filter(item => item.isModified);
      
      if (modifiedItems.length === 0) {
        alert("沒有任何修改需要儲存！");
        return;
      }

      // 要求輸入姓名
      const userName = prompt("請輸入您的姓名以儲存紀錄：", "");
      if (userName === null || userName.trim() === "") {
        alert("必須輸入姓名才能儲存。");
        return;
      }

      const saveBtn = document.querySelector('.save-btn');
      saveBtn.innerText = "儲存中...";
      saveBtn.disabled = true;

      const payload = {
        userName: userName.trim(),
        items: modifiedItems
      };

      try {
        // 使用 POST 發送整批 JSON 資料
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await response.json();

        if (result.success) {
          document.getElementById('last-update').innerText = "Last Update: " + result.lastUpdate;
          alert("✅ 儲存成功！");
          
          // 重置修改標記
          inventoryData.forEach(item => item.isModified = false);
          renderTable();
        }
      } catch (error) {
        alert("❌ 儲存失敗，請檢查網路！");
      }

      saveBtn.innerText = "💾 儲存 (Save)";
      saveBtn.disabled = false;
    }

    // 開啟網頁即載入資料
    loadData();
  </script>
</body>
</html>
